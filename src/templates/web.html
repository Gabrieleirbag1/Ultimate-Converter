{% extends "layout.html" %}

{% block scripts %} 
    <script src="/static/scripts/utils.js"></script>
    <script src="/static/scripts/web.js?v=1.1"></script>
    <script src="/static/scripts/loading.js"></script>
    <script src="/static/scripts/fixing-size.js"></script>
{% endblock %}

{% block content %}
<section>
    <div class="upload-div">
        <div class="container">
            <div id="fixed-card" class="card">
                <h3>Download medias from web</h3>
                <div class="web-box">
                    <form class="download-form" action="{{ url_for('web') }}" method="post" enctype="multipart/form-data">
                        
                        <div id="web-div" class="web-div fixed-sub-div">
                            <div class="file-preview-header">
                                <header>
                                    <h4>Enter url here</h4>
                                </header>
                            </div>
                            <div class="download-p-div">
                            <p class="download-p">Websites Supported: Youtube, Twitter, Instagram, Spotify, TikTok, Reddit</p>
                            </div>
                            <input type="text" name="url" id="url" placeholder="Enter URL">   
                            <button type="button" class="btn" onclick="handleFileUpload()" data-modal="true">Confirm</button>
                        </div>   

                        <div id="file-preview" class="file-preview-div fixed-sub-div">
                            <div class="file-preview-header">
                                <header>
                                    <h4 id="h4-filename"></h4>
                                </header>
                            </div>
                            <div class="select-div">
                                <div class="choose-div">
                                    <label for="file-type">Choose media type:</label>
                                    <select id="file-type" name="file-type" onchange="updateFormats()">
                                    <!-- Options will be populated by JavaScript -->
                                    </select>
                                </div>
                            
                                <div class="choose-div">
                                    <label for="file-format">Choose file format:</label>
                                    <select id="file-format" name="file-format">
                                    <!-- Options will be populated by JavaScript -->
                                    </select>
                                </div>

                                <div class="choose-div" id="resolution-div" style="display: none;">
                                    <label for="resolution">Choose Video Resolution:</label>
                                    <select id="resolution" name="resolution">
                                        <option value="best">Best (Default)</option>
                                        <option value="2160">2160p (4K)</option>
                                        <option value="1440">1440p</option>
                                        <option value="1080">1080p</option>
                                        <option value="720">720p</option>
                                        <option value="480">480p</option>
                                        <option value="360">360p</option>
                                    </select>
                                </div>

                                <div class="choose-div" id="codec-div" style="display: none;">
                                    <label for="codec">Choose Video Codec:</label>
                                    <select id="codec" name="codec">
                                        <option value="best">Best (Default)</option>
                                        <option value="avc">H.264 (AVC)</option>
                                        <option value="vp9">VP9</option>
                                        <option value="av01">AV1</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <button id="submit-button" class="btn" onclick="setLoadingImage();" type="submit">Process</button>
                                <img id="loading-img" src="/static/images/loading.png" alt="loading" style="display: none;">
                            </div>
                        </div>
                    </form>    
                </div> 
            </div>
        </div>
    </div>
</section>
{% endblock %}
